<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="ReadMore — Modern Intelligent News Aggregation Platform. Real-time updates, personalized feeds, full coverage, and market intelligence.">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#0F172A">
  <!-- Optional: populate content with your OAuth 2.0 Web Client ID for live Google Sign-In verification -->
  <meta name="google-signin-client_id" content="">
  <title>ReadMore — Next-Gen News & Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23111111'/><text x='16' y='22' text-anchor='middle' fill='%23F4F3EE' font-size='18' font-family='Georgia,serif' font-weight='bold'>R</text></svg>">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Historic Broadsheet Fonts: Newsreader (Editorial Serif), Playfair Display (Headlines), Cinzel (Monumental Masthead), UnifrakturMaguntia (Gothic Initial), Space Grotesk (Typeset Lead) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400;1,6..72,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round|Material+Icons+Outlined" rel="stylesheet">

  <style>
    :root {
      /* Broadsheet Century-Old Newspaper Monochrome Design Tokens */
      --paper-cream: #F7F5F0;
      --paper-white: #FFFFFF;
      --paper-card: #FAF8F4;
      --paper-border: #DCD8CE;
      --paper-border-dark: #2A2B32;
      
      --ink-black: #111111;
      --ink-charcoal: #25262B;
      --ink-graphite: #4A4A48;
      --ink-slate: #6E6C66;
      --ink-muted: #8E8C85;
      --ink-faint: #B5B3AC;

      /* The Midnight Gazette (Dark Mode Broadsheet) */
      --noir-bg: #0D0E11;
      --noir-surface: #141519;
      --noir-card: #1A1B20;
      --noir-card-secondary: #212228;
      --noir-border: #2D2E36;
      --noir-text-primary: #F4F3EE;
      --noir-text-secondary: #9E9C95;

      /* Broadsheet Rules & Hairlines */
      --double-rule: 3px double currentColor;
      --hairline-rule: 1px solid currentColor;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Newsreader', 'Playfair Display', Georgia, 'Times New Roman', serif;
      overflow-x: hidden;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
    }

    /* Broadsheet Typography Classes */
    .headline-font {
      font-family: 'Playfair Display', Georgia, serif;
      letter-spacing: -0.015em;
    }

    .masthead-font {
      font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .gothic-crest {
      font-family: 'UnifrakturMaguntia', serif;
    }

    .kicker-font {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Broadsheet Double Hairline Rules */
    .broadsheet-rule-top {
      border-top: 3px double currentColor;
    }

    .broadsheet-rule-bottom {
      border-bottom: 3px double currentColor;
    }

    .broadsheet-rule-both {
      border-top: 3px double currentColor;
      border-bottom: 1px solid currentColor;
    }

    /* Custom Scrollbar in Monochrome */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(128, 128, 128, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 128, 128, 0.7);
    }

    /* Modern Monospace / Number Font */
    .mono-font {
      font-family: 'Space Grotesk', monospace;
    }

    /* Card Hover Animations in Monochrome */
    .news-card-hover, [id^="card-"], [id^="hero-card-"], [id^="compact-card-"] {
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.24s ease, border-color 0.24s ease !important;
      cursor: pointer;
    }
    .news-card-hover:hover, [id^="card-"]:hover, [id^="hero-card-"]:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px -6px rgba(0, 0, 0, 0.22) !important;
    }
    [id^="compact-card-"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.18) !important;
    }

    /* Image zoom on card hover */
    .image-zoom-container {
      overflow: hidden;
      border-radius: 12px;
    }
    .image-zoom-container img, [id^="card-"] img, [id^="hero-card-"] img {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .news-card-hover:hover .image-zoom-container img, [id^="card-"]:hover img, [id^="hero-card-"]:hover img {
      transform: scale(1.05);
    }

    /* Pulsing Reading Streak Flame */
    @keyframes flame-pulse {
      0%, 100% {
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.25);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
        transform: scale(1.04);
      }
    }
    #reading-streak-badge {
      animation: flame-pulse 2.2s infinite ease-in-out;
    }
    #reading-streak-badge:hover {
      transform: scale(1.08);
    }

    /* Audio Waveform Bounce */
    @keyframes audio-wave-bounce {
      0%, 100% {
        height: 4px;
        opacity: 0.5;
      }
      50% {
        height: 18px;
        opacity: 1;
      }
    }

    /* Interactive Pill Tap Bounce */
    .interactive-pill, [id^="pill-"] {
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease !important;
    }
    .interactive-pill:hover, [id^="pill-"]:hover {
      transform: translateY(-2px);
    }
    .interactive-pill:active, [id^="pill-"]:active {
      transform: scale(0.92);
    }

    /* Modal Spring Entrance */
    @keyframes spring-modal-in {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .modal-spring-enter, #reader-modal-dialog {
      animation: spring-modal-in 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Side Nav Floating Pill Hover */
    .side-nav-pill {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .side-nav-pill:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4) !important;
    }

    /* Pulsing Breaking News Dot */
    @keyframes pulse-red {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      animation: pulse-red 1.8s infinite;
      margin-right: 6px;
    }

    /* Shimmer Skeleton Animation */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #182234 25%, #253348 50%, #182234 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Image zoom on card hover */
    .image-zoom-container {
      overflow: hidden;
      border-radius: 12px;
    }
    .image-zoom-container img {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .news-card-hover:hover .image-zoom-container img {
      transform: scale(1.05);
    }

    /* Stretched Global Header Search Bar */
    #header-search-container,
    #header-search-container > div,
    #header-search-container > div > div {
      width: 100% !important;
      display: flex !important;
      flex: 1 1 100% !important;
    }
    #header-search-container input {
      width: 100% !important;
    }

    /* Modal Backdrop Blur */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>

  <script defer src="main.dart.js"></script>
</head>

</html>
